spring.application.name=NMS_BE

# Local SQL Server: SQL Server Authentication (sa by default).
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FUNewsManagementSystem;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:sa}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Replay idempotent SQL Server migrations before Hibernate on every application startup.
# Each file is a T-SQL batch; do not split BEGIN/END or dynamic SQL on semicolons.
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.separator=^^^ END OF SCRIPT ^^^
spring.sql.init.continue-on-error=false
spring.sql.init.schema-locations=classpath:db/migrations/001-unicode-text-columns.sql,\
    classpath:db/migrations/002-account-login-lock.sql,\
    classpath:db/migrations/003-account-unlock-otp.sql,\
    classpath:db/migrations/004-report2-account-roles.sql,\
    classpath:db/migrations/005-article-engagement-counters.sql,\
    classpath:db/migrations/006-article-editorial-workflow.sql
spring.jpa.defer-datasource-initialization=false

# Hibernate creates/updates tables inside the existing database without dropping data.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:true}

server.port=${SERVER_PORT:8080}

# Tra ve noi dung loi (message) trong JSON khi service nem ResponseStatusException, de demo de doc.
spring.web.error.include-message=always
# Khong tra stack trace trong JSON loi (devtools mac dinh bat), response gon de doc khi demo.
spring.web.error.include-stacktrace=never

# Swagger UI: http://localhost:8080/swagger-ui.html ; tai lieu JSON: /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Base64 (at least 32 random bytes) or hex (at least 64 digits).
# Without a configured secret, local runs use a random key valid until restart.
jwt.secret=${JWT_SECRET:}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:${JWT_EXPIRATION_MS:1800000}}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.issuer=${JWT_ISSUER:NMS_BE}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.migrate-plaintext-passwords=${MIGRATE_PLAINTEXT_PASSWORDS:true}

# SMTP is optional at startup, but required to deliver account-unlock OTPs.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dangdnnhe180137@fpt.edu.vn}
spring.mail.password=${MAIL_PASSWORD:psmj hzek xrli atbj}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000
app.mail.from=${MAIL_FROM:dangdnnhe180137@fpt.edu.vn}

# Document only the versioned business API controllers.
springdoc.packages-to-scan=com.mvc.nms_be.controller
springdoc.paths-to-match=/api/v1/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
