# Optional SQL Server login instead of Windows Authentication.
# Enable with SPRING_PROFILES_ACTIVE=sql-auth and supply DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=FUNewsManagementSystem;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
